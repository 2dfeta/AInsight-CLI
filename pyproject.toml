[tool.poetry]
name = "ainsight-cli"
version = "1.0.0"
description = "AI-powered source code analysis CLI: security audits, logic explanation, test generation, and refactoring."
authors = ["AInsight Team <team@ainsight.dev>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ainsight/ainsight-cli"
repository = "https://github.com/ainsight/ainsight-cli"
keywords = ["ai", "cli", "code-analysis", "security", "refactoring", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
packages = [{ include = "ainsight" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = { version = "^0.12.3", extras = ["all"] }
rich = "^13.7.1"
httpx = "^0.27.0"
pyyaml = "^6.0.1"
pathspec = "^0.12.1"
openai = "^1.30.0"
google-generativeai = "^0.7.0"
anthropic = "^0.28.0"
tiktoken = "^0.7.0"
jinja2 = "^3.1.4"
aiofiles = "^23.2.1"
tenacity = "^8.3.0"
pygments = "^2.18.0"
click = "^8.1.7"
anyio = "^4.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
ruff = "^0.4.7"
mypy = "^1.10.0"
black = "^24.4.2"
pre-commit = "^3.7.1"

[tool.poetry.scripts]
ainsight = "ainsight.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=ainsight --cov-report=term-missing --cov-report=html"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
